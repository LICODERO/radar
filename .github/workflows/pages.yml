name: Site

# Publishes the one-page site (site/) with GitHub Pages: no server, no passwords. One-time setup in the repository settings:
# Settings -> Pages -> Source: GitHub Actions, custom domain radar.licodero.pl (a CNAME record radar -> lookashdev.github.io).
# The optional repository variable GA_ID (a GA4 measurement id) switches the cookie banner and Google Analytics on.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['site/**']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: The analytics id is set at deploy time, never committed
        env:
          GA_ID: ${{ vars.GA_ID }}
        run: |
          if [ -n "$GA_ID" ]; then sed -i "s/GA_ID: ''/GA_ID: '$GA_ID'/" site/assets/config.js; fi
          grep -n "GA_ID" site/assets/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
