<div class="brand">
  <div class="title">R.A.D.A.R</div>
  <div class="m sub">REPO AI DISCOVERY AND REVIEW</div>
</div>

<div class="path">
  <div class="path-row">
    <div class="m label">ŚCIEŻKA SKANU</div>
    @if (editing()) {
      <input class="m path-box path-input" type="text" aria-label="Ścieżka katalogu skanu" placeholder="~/projects"
             [value]="draft()" (input)="onDraft($event)" (keydown.enter)="confirm()" (keydown.escape)="cancelEdit()" />
      <button class="m btn-ghost ok" type="button" (click)="confirm()">OK</button>
      <button class="m btn-ghost" type="button" (click)="cancelEdit()">ANULUJ</button>
    } @else {
      <div class="m path-box" [title]="pathText()">{{ pathText() }}</div>
      <button class="m btn-ghost tip tip-b" type="button" [attr.data-tip]="isMock() ? 'Tryb danych przykładowych' : 'Zmień katalog i od razu skanuj'"
              [disabled]="isMock() || store.scanning()" (click)="change()">ZMIEŃ</button>
    }
  </div>
  @if (store.notice(); as n) {
    <div class="m info notice" role="alert">{{ n }}</div>
  } @else if (store.staleRoot()) {
    <div class="m info warn">WYNIKI Z INNEGO KATALOGU</div>
  }
</div>

<div class="clock-block">
  <div class="clock-text">
    <div class="m label">TERAZ</div>
    <div class="m clock">{{ clock() }}</div>
    <div class="m last">OSTATNI SKAN {{ lastScan() }}</div>
  </div>
  <button class="m btn-solid tip tip-b tip-r" type="button" [attr.data-tip]="scanTip()" [disabled]="!store.canScan()" (click)="store.startScan()">
    {{ hasResult() ? 'SKANUJ PONOWNIE' : 'SKANUJ' }}
  </button>
</div>
