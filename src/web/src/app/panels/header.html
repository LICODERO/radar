<div class="brand">
  <div class="title">R.A.D.A.R.</div>
  <div class="m sub">REPO AI DISCOVERY AND REVIEW</div>
</div>

<div class="path">
  <div class="path-row" data-tour="scan-path">
    <div class="m label">{{ t('header.scanPath') }}</div>
    @if (editing()) {
      <input class="m path-box path-input" type="text" [attr.aria-label]="t('header.scanPathAria')" placeholder="~/projects"
             [value]="draft()" (input)="onDraft($event)" (keydown.enter)="confirm()" (keydown.escape)="cancelEdit()" />
      <button class="m btn-ghost ok" type="button" (click)="confirm()">OK</button>
      <button class="m btn-ghost" type="button" (click)="cancelEdit()">{{ t('header.cancel') }}</button>
    } @else {
      <div class="m path-box" [title]="pathText()">{{ pathText() }}</div>
      <button class="m btn-ghost tip tip-b" type="button" [attr.data-tip]="isMock() ? t('header.mockTip') : t('header.changeTip')"
              [disabled]="isMock() || store.scanning()" (click)="change()">{{ t('header.change') }}</button>
    }
  </div>
  @if (store.notice(); as n) {
    <div class="m info notice" role="alert">{{ n }}</div>
  } @else if (store.staleRoot()) {
    <div class="m info warn">{{ t('header.staleRoot') }}</div>
  }
</div>

<div class="lang m" role="group" [attr.aria-label]="t('lang.label')">
  @for (l of langs; track l) {
    <button type="button" [class.on]="i18n.lang() === l" [attr.aria-pressed]="i18n.lang() === l" (click)="i18n.setLang(l)">{{ l.toUpperCase() }}</button>
  }
</div>

<div class="clock-block">
  <div class="clock-text">
    <div class="m label">{{ t('header.now') }}</div>
    <div class="m clock">{{ clock() }}</div>
    <div class="m last tip tip-b tip-r" role="img" tabindex="0" [attr.data-tip]="t('header.lastScanLabel')" [attr.aria-label]="t('header.lastScan', { when: lastScan() })">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z" /></svg>
      <span aria-hidden="true">{{ lastScan() }}</span>
    </div>
  </div>
  <button class="m btn-solid tip tip-b tip-r" type="button" data-tour="scan-btn" [attr.data-tip]="scanTip()" [disabled]="!store.canScan()" (click)="store.startScan()">
    {{ hasResult() ? t('header.rescan') : t('header.scan') }}
  </button>
</div>
