name: Idea / Pomysł
description: Suggest a feature or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / Co chcesz osiągnąć?
      description: The situation and what is hard today, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work? / Jak mogłoby działać?
